[defaults]
roles_path = ./ansible/roles
collections_path = ./ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled = False
vault_password_file = ~/.ansible_vault_pass
local_tmp = /tmp/.ansible-local-tmp
# Explicit default remote temporary directory; pre-created in base role
# to silence Ansible's warning when escalating privileges via become.
remote_tmp = ~/.ansible/tmp
interpreter_python = auto_silent
stdout_callback = yaml

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
