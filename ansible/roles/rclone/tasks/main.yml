---
- name: Install required packages
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - rclone

- name: Ensure bin and logs directories exist
  become: true
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - bin
    - logs

- name: Copy rclone script
  when: ansible_distribution in ['Debian', 'Ubuntu']
  ansible.builtin.copy:
    src: "rclone.sh"
    dest: "/home/{{ ansible_user }}/bin/rclone.sh"
    mode: "0755"

- name: Install rclone script in crontab
  ansible.builtin.cron:
    name: "rclone {{ item.provider }} {{ item.bucket }}"
    user: "{{ ansible_user }}"
    hour: "{{ item.hour | default(4 + ((idx * 15) // 60)) | string }}"
    minute: "{{ item.minute | default((idx * 15) % 60) | string }}"
    job: "/home/{{ ansible_user }}/bin/rclone.sh {{ item.provider }} {{ item.destination }} {{ item.bucket }}"
  loop: "{{ rclone_jobs | default([]) }}"
  loop_control:
    index_var: idx
