---
- name: Query installed rclone version
  ansible.builtin.command:
    cmd: rclone --version
  register: rclone_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Query latest upstream rclone version
  ansible.builtin.uri:
    url: https://downloads.rclone.org/version.txt
    return_content: true
  register: rclone_upstream_version
  changed_when: false
  check_mode: false

- name: Install or upgrade official rclone package
  when: >-
    rclone_installed_version.rc != 0 or
    (rclone_installed_version.stdout_lines | first | default('')) != (rclone_upstream_version.content | trim)
  ansible.builtin.apt:
    deb: "https://downloads.rclone.org/rclone-current-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.deb"

- name: Ensure rclone configuration directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/rclone"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy local rclone.conf to remote host
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/rclone/rclone.conf"
    dest: "/home/{{ ansible_user }}/.config/rclone/rclone.conf"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: false
  no_log: true

- name: Validate and resolve rclone jobs
  ansible.builtin.import_tasks: validate.yml

- name: Query systemd mount unit names for rclone mount paths
  when: (rclone_jobs_resolved | default([])) | length > 0
  ansible.builtin.command:
    argv: >-
      {{
        ['systemd-escape', '--path', '--suffix=mount'] +
        (rclone_jobs_resolved | map(attribute='mount_path') | unique | sort | list)
      }}
  register: rclone_mount_units_cmd
  changed_when: false
  check_mode: false

- name: Record mapping of mount paths to systemd mount unit names
  ansible.builtin.set_fact:
    rclone_mount_dict: >-
      {{
        dict(
          (rclone_jobs_resolved | map(attribute='mount_path') | unique | sort | list)
          | zip(rclone_mount_units_cmd.stdout | default('') | split)
        )
      }}

- name: Deploy rclone systemd service unit
  ansible.builtin.template:
    src: rclone-sync.service.j2
    dest: "/etc/systemd/system/rclone-sync-{{ item.name }}.service"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ rclone_jobs_resolved | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: rclone_service_unit_templates

- name: Deploy rclone systemd timer unit
  ansible.builtin.template:
    src: rclone-sync.timer.j2
    dest: "/etc/systemd/system/rclone-sync-{{ item.name }}.timer"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ rclone_jobs_resolved | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: rclone_timer_unit_templates

- name: Reload systemd daemon if rclone unit files changed
  when: rclone_service_unit_templates.changed or rclone_timer_unit_templates.changed
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Clean up orphaned rclone systemd units
  ansible.builtin.import_tasks: cleanup.yml

- name: Enable and start rclone systemd timer
  ansible.builtin.systemd_service:
    name: "rclone-sync-{{ item.name }}.timer"
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ rclone_jobs_resolved | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
