---
- name: Install required packages
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - rclone

- name: Ensure bin and logs directories exist
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: olivier
    group: olivier
  loop:
    - bin
    - logs

- name: Copy rclone script
  when: ansible_distribution in ['Debian', 'Ubuntu']
  ansible.builtin.copy:
    src: "rclone.sh"
    dest: "{{ crypto_base_dir }}/bin/rclone.sh"
    mode: "0755"

- name: Install rclone script in crontab
  ansible.builtin.cron:
    name: "rclone {{ item.provider }} {{ item.bucket }}"
    user: "olivier"
    hour: "4"
    minute: "0"
    job: "{{ crypto_base_dir }}/bin/rclone.sh {{ item.provider }} {{ item.bucket }}"
  loop: "{{ rclone_jobs | default('[]') }}"
