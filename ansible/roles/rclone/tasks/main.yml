---
- name: Query installed rclone version
  ansible.builtin.command:
    cmd: rclone --version
  register: rclone_installed_version
  changed_when: false
  failed_when: false

- name: Query latest upstream rclone version
  ansible.builtin.uri:
    url: https://downloads.rclone.org/version.txt
    return_content: true
  register: rclone_upstream_version
  changed_when: false

- name: Install or upgrade official rclone package
  when: >-
    rclone_installed_version.rc != 0 or
    (rclone_installed_version.stdout_lines | first | default('')) != (rclone_upstream_version.content | trim)
  ansible.builtin.apt:
    deb: "https://downloads.rclone.org/rclone-current-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.deb"

- name: Ensure rclone configuration directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/rclone"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy local rclone.conf to remote host
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/rclone/rclone.conf"
    dest: "/home/{{ ansible_user }}/.config/rclone/rclone.conf"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  no_log: true

- name: "Deploy rclone systemd service unit: {{ item.provider }}"
  ansible.builtin.template:
    src: rclone-sync.service.j2
    dest: >-
      /etc/systemd/system/rclone-sync-{{
        ((item.provider ~ ('-' ~ item.bucket if (item.bucket | default('') | length > 0) else ''))
        | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', ''))
      }}.service
    mode: "0644"
    owner: root
    group: root
  loop: "{{ rclone_jobs | default([]) }}"
  loop_control:
    index_var: rclone_job_idx
    label: "{{ item.provider }}:{{ item.bucket | default('') }}"

- name: "Deploy rclone systemd timer unit: {{ item.provider }}"
  ansible.builtin.template:
    src: rclone-sync.timer.j2
    dest: >-
      /etc/systemd/system/rclone-sync-{{
        ((item.provider ~ ('-' ~ item.bucket if (item.bucket | default('') | length > 0) else ''))
        | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', ''))
      }}.timer
    mode: "0644"
    owner: root
    group: root
  loop: "{{ rclone_jobs | default([]) }}"
  loop_control:
    index_var: rclone_job_idx
    label: "{{ item.provider }}:{{ item.bucket | default('') }}"

- name: "Enable and start rclone systemd timer: {{ item.provider }}"
  ansible.builtin.systemd_service:
    name: >-
      rclone-sync-{{
        ((item.provider ~ ('-' ~ item.bucket if (item.bucket | default('') | length > 0) else ''))
        | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', ''))
      }}.timer
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ rclone_jobs | default([]) }}"
  loop_control:
    label: "{{ item.provider }}:{{ item.bucket | default('') }}"
