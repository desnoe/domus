---
# Blocking validation of rclone_jobs. Runs from backup.yml pre_tasks (before any
# deployment) and again at the start of the rclone role. Every failure message
# starts with rclone_validation_prefix so that tests can detect it reliably.
- name: Reject legacy flat rclone_jobs schema
  ansible.builtin.assert:
    quiet: true
    that:
      - item is mapping
      - "'provider' not in item"
      - "'bucket' not in item"
      - item.destination is not defined or item.destination is mapping
    fail_msg: >-
      {{ rclone_validation_prefix }} job #{{ rclone_job_idx }} uses the legacy flat schema
      (provider/bucket/destination). Migrate to: name, source.provider, source.path,
      destination.mount, destination.path.
  loop: "{{ rclone_jobs | default([]) }}"
  loop_control:
    index_var: rclone_job_idx
    label: "#{{ rclone_job_idx }}"

- name: Validate rclone job schema and paths
  ansible.builtin.assert:
    quiet: true
    that:
      - item.keys() | difference(rclone_job_allowed_keys) | length == 0
      - item.name is defined and item.name is string
      - item.name is match('^[a-z0-9][a-z0-9-]*$')
      - item.source is defined and item.source is mapping
      - item.source.keys() | difference(['provider', 'path']) | length == 0
      - item.source.provider is defined and item.source.provider is string and item.source.provider | length > 0
      - item.source.path is not defined or item.source.path is string
      - item.destination is defined and item.destination is mapping
      - item.destination.keys() | difference(['mount', 'path']) | length == 0
      - item.destination.mount is defined and item.destination.mount is string
      - item.destination.mount is match('^/')
      - (item.destination.mount | regex_replace('/+$', '')) in rclone_allowed_mounts
      - item.destination.path is not defined or item.destination.path is string
      - item.destination.path is not defined or item.destination.path is not match('^/')
      - item.destination.path is not defined or item.destination.path is not search('(^|/)\.\.(/|$)')
      - item.destination.path is not defined or (item.destination.path | regex_replace('^/+|/+$', '') | length > 0)
      - item.hour is not defined or (item.hour is integer and 0 <= item.hour <= 23)
      - item.minute is not defined or (item.minute is integer and 0 <= item.minute <= 59)
      - >-
        item.filters is not defined or (item.filters is sequence and item.filters is not string
        and item.filters | select('string') | list | length == item.filters | length)
      - >-
        item.extra_args is not defined or (item.extra_args is sequence and item.extra_args is not string
        and item.extra_args | select('string') | list | length == item.extra_args | length)
    fail_msg: >-
      {{ rclone_validation_prefix }} job #{{ rclone_job_idx }} ({{ item.name | default('unnamed') }})
      is invalid. Rules: name matches ^[a-z0-9][a-z0-9-]*$; only keys {{ rclone_job_allowed_keys | join(', ') }};
      source.provider is a non-empty string; destination.mount is an absolute path declared in
      crypto_disks[*].subvolumes ({{ rclone_allowed_mounts | join(', ') }}); destination.path, when set, is a
      non-empty relative path without '..'; hour 0-23; minute 0-59; filters/extra_args are lists of strings.
  vars:
    rclone_allowed_mounts: >-
      {{ crypto_disks | default([]) | map(attribute='subvolumes') | flatten | map('regex_replace', '/+$', '') | list }}
  loop: "{{ rclone_jobs | default([]) }}"
  loop_control:
    index_var: rclone_job_idx
    label: "{{ item.name | default('#' ~ rclone_job_idx) }}"

- name: Validate rclone job names are unique
  ansible.builtin.assert:
    quiet: true
    that:
      - rclone_job_names | unique | length == rclone_job_names | length
    fail_msg: >-
      {{ rclone_validation_prefix }} duplicate job names:
      {{ rclone_job_names | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | join(', ') }}
  vars:
    rclone_job_names: "{{ rclone_jobs | default([]) | map(attribute='name') | list }}"

- name: Resolve rclone job target directories
  ansible.builtin.import_tasks: resolve.yml

- name: Validate rclone target directories are unique and not nested
  ansible.builtin.assert:
    quiet: true
    that:
      - rclone_target_dirs | select('equalto', item.target_dir) | list | length == 1
      - rclone_target_dirs | select('match', (item.target_dir ~ '/') | regex_escape) | list | length == 0
    fail_msg: >-
      {{ rclone_validation_prefix }} target directory {{ item.target_dir }} of job {{ item.name }}
      is shared with or contains another job target ({{ rclone_target_dirs | join(', ') }}).
      'rclone sync' deletes extraneous files, so targets must never overlap.
  vars:
    rclone_target_dirs: "{{ rclone_jobs_resolved | map(attribute='target_dir') | list }}"
  loop: "{{ rclone_jobs_resolved }}"
  loop_control:
    label: "{{ item.name }}"
