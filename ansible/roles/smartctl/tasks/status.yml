---
- name: Check smartctl_exporter systemd service status  # noqa: command-instead-of-module
  become: true
  ansible.builtin.command:
    cmd: systemctl is-active smartctl_exporter
  register: smartctl_service_active_cmd
  changed_when: false
  failed_when: false

- name: Query S.M.A.R.T. metrics from local smartctl_exporter endpoint
  ansible.builtin.uri:
    url: "http://{{ smartctl_exporter_listen_address }}/metrics"
    return_content: true
    timeout: 5
  register: smartctl_metrics_response
  changed_when: false
  failed_when: false

- name: Parse monitored S.M.A.R.T. devices count
  ansible.builtin.set_fact:
    smartctl_monitored_devices_count: >-
      {{
        (smartctl_metrics_response.content | default('') | regex_findall('^smartctl_device\{', multiline=True)) | length
      }}

- name: Display S.M.A.R.T. monitoring health status
  ansible.builtin.debug:
    msg: |
      =======================================================
      S.M.A.R.T. MONITORING REPORT ({{ inventory_hostname }})
      Service: smartctl_exporter ({{ smartctl_service_active_cmd.stdout | default('inactive') }})
      Listen Address: {{ smartctl_exporter_listen_address }}
      Monitored Devices: {{ smartctl_monitored_devices_count }}
      =======================================================
