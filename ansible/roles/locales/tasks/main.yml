---
- name: Install locales package
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    name:
      - locales
    state: present

- name: Configure /etc/default/locale
  become: true
  ansible.builtin.copy:
    src: "locale"
    dest: "/etc/default/locale"
    mode: "0644"

- name: Configure /etc/locale.gen
  become: true
  ansible.builtin.copy:
    src: "locale.gen"
    dest: "/etc/locale.gen"
    mode: "0644"

- name: Ensure en_US.UTF-8 locale exists
  become: true
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Ensure fr_FR.UTF-8 locale exists
  become: true
  community.general.locale_gen:
    name: fr_FR.UTF-8
    state: present
