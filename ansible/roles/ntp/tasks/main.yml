---
- name: Set NTP package name
  ansible.builtin.set_fact:
    ntp_service_name: "{{ 'chrony' if (ansible_distribution == 'Debian' and (ansible_distribution_major_version | default('0') | int >= 12)) else 'ntp' }}"

- name: Install NTP and timezone packages
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - tzdata
      - "{{ ntp_service_name }}"

- name: Set timezone
  become: true
  community.general.timezone:
    name: Europe/Paris

- name: Ensure NTP service is running and enabled
  become: true
  ansible.builtin.service:
    name: "{{ ntp_service_name }}"
    state: started
    enabled: true
