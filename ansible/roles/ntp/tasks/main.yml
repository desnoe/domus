---
- name: Install chrony and timezone packages
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - chrony
      - tzdata

- name: Set timezone to Europe/Paris
  become: true
  community.general.timezone:
    name: Europe/Paris

- name: Configure /etc/chrony/chrony.conf
  become: true
  ansible.builtin.copy:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Verify chrony configuration syntax
  become: true
  ansible.builtin.command:
    cmd: /usr/sbin/chronyd -p -f /etc/chrony/chrony.conf
  changed_when: false

- name: Ensure chrony service is running and enabled
  become: true
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Force immediate clock sync
  become: true
  ansible.builtin.command:
    cmd: chronyc makestep
  changed_when: false
