---
crypto_wipe: false

# Default mount options for Btrfs subvolumes in /etc/fstab:
# - rw,async: Explicitly locks read-write and asynchronous I/O mode, allowing the kernel
#   page cache to buffer and flush sequential writes cleanly. Replaces 'defaults' to avoid
#   conflicts with 'boot: false' in ansible.posix.mount.
# - nofail: Prevents boot failure if encrypted devices are not yet unlocked.
# - compress=zstd:1: Fast, low-latency compression profile delivering high I/O throughput
#   with minimal CPU overhead on low-power nodes (optimized for media/RAW and backup streams).
# - noatime: Eliminates metadata write overhead on read operations, preserving SSD flash endurance
#   and preventing unnecessary CoW snapshot extent divergence.
# - user_subvol_rm_allowed: Permits unprivileged subvolume deletion for snapshot rotation.
# Note: 'autodefrag' is intentionally avoided to prevent breaking CoW extent sharing across
# Btrfs snapshots (which would cause severe snapshot space inflation) and SSD wear.
crypto_btrfs_default_mount_options: "rw,async,nofail,compress=zstd:1,noatime,user_subvol_rm_allowed"

# Performance flags passed to cryptsetup luksOpen when unlocking LUKS2 devices.
# Bypasses async dm-crypt workqueues (kcryptd) for inline AES-NI / ARMv8 CE hardware processing.
crypto_perf_flags: "--perf-no_read_workqueue --perf-no_write_workqueue"

# Declarative list of directory paths where Btrfs transparent compression should be disabled.
# Sets the 'm' (no compression) attribute, ensuring uncompressible media files
# (photos, RAW, videos) bypass CPU-intensive zstd compression tests.
crypto_no_compression_paths: []


# Declarative list of encrypted block devices or RAID pools to manage on the host.
# Supports 0 disks (empty list), 1 disk, or multiple disks.
# For 1 device: formats standard Btrfs filesystem.
# For 2+ devices: formats native Btrfs RAID1 (-d raid1 -m raid1).
# Each subvolume is defined as an absolute mount path; its internal Btrfs subvolume
# name is derived by flattening slashes into underscores (e.g. /data/sync -> data_sync).
# Example:
# crypto_disks:
#   - name: data
#     devices:
#       - /dev/disk/by-id/ata-debian-1_SSD_...
#     subvolumes:
#       - /home/{{ ansible_user }}/data/sync
#       - /home/{{ ansible_user }}/data/snapshots
crypto_disks: []
