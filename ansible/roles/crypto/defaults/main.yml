---
crypto_wipe: false

# Default mount options for Btrfs subvolumes in /etc/fstab:
# - rw,async: Explicitly locks read-write and asynchronous I/O mode (critical for SMR
#   drives such as Seagate Barracuda, allowing the kernel page cache to buffer and
#   schedule writes sequentially before flushing, avoiding process stalls).
# - nofail: Prevents boot failure if encrypted devices are not yet unlocked.
# - compress=zstd:1: Fast, low-latency compression chosen over zstd:3 to emit steady,
#   rapid write streams that feed the SMR CMR cache without erratic latency spikes.
# - noatime: Eliminates metadata write overhead on read operations.
# - user_subvol_rm_allowed: Permits unprivileged subvolume deletion for snapshot rotation.
# Note: 'defaults' is replaced by explicit 'rw,async' to avoid conflicts with 'boot: false'
# in ansible.posix.mount (which emits warnings when 'defaults' is present).
# Note: 'autodefrag' is intentionally avoided to prevent destructive SMR write amplification.
crypto_btrfs_default_mount_options: "rw,async,nofail,compress=zstd:1,noatime,user_subvol_rm_allowed"


# Declarative list of encrypted block devices or RAID pools to manage on the host.
# Supports 0 disks (empty list), 1 disk, or multiple disks.
# For 1 device: formats standard Btrfs filesystem.
# For 2+ devices: formats native Btrfs RAID1 (-d raid1 -m raid1).
# Each subvolume is defined as an absolute mount path; its internal Btrfs subvolume
# name is derived by flattening slashes into underscores (e.g. /data/sync -> data_sync).
# Example:
# crypto_disks:
#   - name: data
#     devices:
#       - /dev/disk/by-id/ata-debian-1_SSD_...
#     subvolumes:
#       - /home/{{ ansible_user }}/data/sync
#       - /home/{{ ansible_user }}/data/snapshots
crypto_disks: []
