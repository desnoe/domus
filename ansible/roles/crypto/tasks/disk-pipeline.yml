---
- name: "Verify subvolumes are defined for disk pool: {{ disk.name }}"
  ansible.builtin.assert:
    that:
      - disk.subvolumes is defined
      - disk.subvolumes | length > 0
    fail_msg: "Pool '{{ disk.name }}' must define at least one absolute mount path in 'subvolumes'."

- name: "Set operational facts for disk: {{ disk.name }}"
  ansible.builtin.set_fact:
    disk_name: "{{ disk.name }}"
    disk_devices: "{{ disk.devices }}"
    disk_passphrase: "{{ disk.passphrase | default(luks_pass) }}"
    disk_subvolumes: "{{ disk.subvolumes }}"

- name: "Unmount subvolumes and clean fstab entries before wipe: {{ disk_name }}"
  when: wipe | default(false) | bool
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      for mp in $(awk '$1 == "LABEL={{ disk_name }}" {print $2}' /etc/fstab); do
        umount "$mp" 2>/dev/null || true
      done
      sed -i '/^LABEL={{ disk_name }}[[:space:]]/d' /etc/fstab
  changed_when: true

- name: "(re-)encrypt member devices: {{ disk_name }}"
  when: wipe | default(false) | bool
  ansible.builtin.include_tasks: disk-encrypt.yml
  loop: "{{ disk_devices }}"
  loop_control:
    loop_var: dev_item
    index_var: dev_idx

- name: "Decrypt and open member devices: {{ disk_name }}"
  ansible.builtin.include_tasks: disk-decrypt.yml
  loop: "{{ disk_devices }}"
  loop_control:
    loop_var: dev_item
    index_var: dev_idx

- name: "Backup LUKS headers for member devices: {{ disk_name }}"
  ansible.builtin.include_tasks: header-backup.yml
  loop: "{{ disk_devices }}"
  loop_control:
    loop_var: dev_item
    index_var: dev_idx

- name: "(re-)set filesystem: {{ disk_name }}"
  when: wipe | default(false) | bool
  ansible.builtin.include_tasks: fs-reset.yml

- name: "Scan for multi-device Btrfs pools: {{ disk_name }}"
  become: true
  ansible.builtin.command:
    cmd: "btrfs device scan"
  changed_when: false

- name: "Mount Btrfs subvolumes: {{ disk_name }}"
  ansible.builtin.include_tasks: fs-mount.yml
