---

- name: "install required packages"
  become: true
  apt:
    state: present
    name:
      - cryptsetup
      - lvm2
      - btrfs-tools

- name: "(re-)encrypt block device"
  when: wipe == True
  include: disk-encrypt.yml

- name: "decrypt and open encrypted block device"
  include: disk-decrypt.yml

- name: "(re-)set LVM2 volumes"
  when: wipe == True
  include: lvm2-reset.yml

- name: "(re-)set partitions"
  when: wipe == True
  include: fs-reset.yml

- name: "mount partitions"
  include: fs-mount.yml
