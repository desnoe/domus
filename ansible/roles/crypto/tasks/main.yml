---
- name: Install required packages
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - cryptsetup
      - btrfs-progs

- name: (re-)encrypt block device
  when: wipe | default(false) | bool
  ansible.builtin.include_tasks: disk-encrypt.yml

- name: Decrypt and open encrypted block device
  ansible.builtin.include_tasks: disk-decrypt.yml

- name: (re-)set filesystem
  when: wipe | default(false) | bool
  ansible.builtin.include_tasks: fs-reset.yml

- name: Mount Btrfs subvolumes
  ansible.builtin.include_tasks: fs-mount.yml
