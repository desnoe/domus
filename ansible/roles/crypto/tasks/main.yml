---
- name: Install required storage packages
  when: (crypto_disks | default([])) | length > 0
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - cryptsetup
      - btrfs-progs

- name: Process encrypted disk pipeline
  ansible.builtin.include_tasks: disk-pipeline.yml
  loop: "{{ crypto_disks | default([]) }}"
  loop_control:
    loop_var: disk
