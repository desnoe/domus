---
- name: Unmount Btrfs subvolumes
  become: true
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    state: unmounted
  loop: "{{ btrfs_subvolumes }}"

- name: Check if encrypted volume exists or not
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_name }}"
  register: luks_volume

- name: Close encrypted disk
  become: true
  ansible.builtin.command: "cryptsetup luksClose /dev/mapper/{{ luks_name }}"
  when: luks_volume.stat.exists

- name: Format LUKS encrypted device
  become: true
  no_log: true
  ansible.builtin.command:
    cmd: "cryptsetup luksFormat -q -v -c aes-xts-plain64 -h sha256 {{ luks_dev }} --key-file -"
    stdin: "{{ luks_pass }}"
