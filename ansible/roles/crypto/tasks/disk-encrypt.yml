---
- name: "Identify any active mapper on device: {{ dev_item }}"
  become: true
  ansible.builtin.shell:
    cmd: "lsblk -rno NAME,TYPE {{ dev_item }} | awk '$2 == \"crypt\" {print $1}'"
  register: active_crypt_holders
  changed_when: false

- name: "Close any active encrypted mapper on device: {{ dev_item }}"
  become: true
  ansible.builtin.command:
    cmd: "cryptsetup luksClose {{ item }}"
  loop: "{{ active_crypt_holders.stdout_lines }}"
  when: active_crypt_holders.stdout_lines | length > 0

- name: "Format LUKS encrypted device: {{ dev_item }}"
  become: true
  no_log: true
  ansible.builtin.command:
    cmd: "cryptsetup luksFormat -q -v -c aes-xts-plain64 -h sha256 {{ dev_item }} --key-file -"
    stdin: "{{ disk_passphrase }}"

- name: "Remove stale LUKS header backup if wiping: {{ disk_name }}-{{ dev_idx }}"
  become: true
  ansible.builtin.file:
    path: "/var/backups/luks/luks-header-{{ disk_name }}-{{ dev_idx }}.img"
    state: absent
