---
- name: Unmount sync
  become: true
  ansible.posix.mount:
    path: "{{ crypto_base_dir }}/sync"
    state: unmounted

- name: Unmount snapshots
  become: true
  ansible.posix.mount:
    path: "{{ crypto_base_dir }}/snapshots"
    state: unmounted

- name: Check if encrypted volume exists or not
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_name }}"
  register: luks_volume

- name: Close volume group
  become: true
  ansible.builtin.command: lvchange -an vg_data
  when: luks_volume.stat.exists

- name: Close encrypted disk
  become: true
  ansible.builtin.command: "cryptsetup luksClose /dev/mapper/{{ luks_name }}"
  when: luks_volume.stat.exists

- name: Format LUKS encrypted device
  become: true
  no_log: true
  ansible.builtin.command:
    cmd: "cryptsetup luksFormat -q -v -c aes-xts-plain64 -h sha256 {{ luks_dev }} --key-file -"
    stdin: "{{ luks_pass }}"
