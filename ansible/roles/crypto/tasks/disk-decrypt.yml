---
- name: Check if encrypted volume exists or not
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_name }}"
  register: luks_volume

- name: Open LUKS encrypted device
  become: true
  no_log: true
  ansible.builtin.command:
    cmd: "cryptsetup luksOpen {{ luks_dev }} {{ luks_name }} --key-file -"
    stdin: "{{ luks_pass }}"
  when: not luks_volume.stat.exists

- name: Activate all known volume groups in the system
  become: true
  ansible.builtin.command: vgchange -a y
  when: not luks_volume.stat.exists
