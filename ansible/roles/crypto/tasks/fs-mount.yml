---
- name: Ensure crypto base directory exists
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Ensure disk base directory exists: {{ disk_base_mount }}"
  become: true
  ansible.builtin.file:
    path: "{{ disk_base_mount }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Ensure Btrfs subvolumes exist: {{ disk_name }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      tmpdir=$(mktemp -d)
      trap 'umount "$tmpdir" 2>/dev/null || true; rmdir "$tmpdir" 2>/dev/null || true' EXIT
      mount -o noatime,subvolid=5 LABEL={{ disk_name }} "$tmpdir"
      created=0
      {% for subvol in disk_subvolumes %}
      if ! btrfs subvolume show "$tmpdir/{{ subvol.name }}" >/dev/null 2>&1; then
        btrfs subvolume create "$tmpdir/{{ subvol.name }}"
        created=1
      fi
      {% endfor %}
      exit $((created == 1 ? 100 : 0))
  register: btrfs_subvol_create
  changed_when: btrfs_subvol_create.rc == 100
  failed_when: btrfs_subvol_create.rc not in [0, 100]

- name: "Ensure subvolume mount directories exist: {{ disk_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ item.mount_point | default(disk_base_mount + '/' + item.name) }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
  loop: "{{ disk_subvolumes }}"

- name: "Mount Btrfs subvolumes in fstab: {{ disk_name }}"
  become: true
  ansible.posix.mount:
    path: "{{ item.mount_point | default(disk_base_mount + '/' + item.name) }}"
    src: "LABEL={{ disk_name }}"
    fstype: btrfs
    opts: "{{ item.opts | default(btrfs_default_mount_options + ',subvol=' + item.name) }}"
    boot: false
    state: mounted
  loop: "{{ disk_subvolumes }}"

- name: "Ensure subvolume permissions after mounting: {{ disk_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ item.mount_point | default(disk_base_mount + '/' + item.name) }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
  loop: "{{ disk_subvolumes }}"

- name: "Configure monthly Btrfs scrub cron job: {{ disk_name }}"
  become: true
  ansible.builtin.cron:
    name: "btrfs scrub {{ disk_name }}"
    user: "root"
    special_time: "monthly"
    job: "/usr/bin/btrfs scrub start -B {{ disk_subvolumes[0].mount_point | default(disk_base_mount + '/' + disk_subvolumes[0].name) }} >/dev/null 2>&1"
