---
- name: Ensure crypto base directory exists
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}"
    state: directory
    mode: "0755"
    owner: olivier
    group: olivier

- name: Ensure Btrfs subvolumes exist
  become: true
  community.general.btrfs_subvolume:
    name: "{{ item.name }}"
    filesystem_device: "/dev/mapper/{{ luks_name }}"
    automount: true
    state: present
  loop: "{{ btrfs_subvolumes }}"

- name: Ensure subvolume mount directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('olivier') }}"
    group: "{{ item.group | default('olivier') }}"
  loop: "{{ btrfs_subvolumes }}"

- name: Mount Btrfs subvolumes in fstab
  become: true
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "/dev/mapper/{{ luks_name }}"
    fstype: btrfs
    opts: "{{ item.opts | default(btrfs_default_mount_options + ',subvol=' + item.name) }}"
    state: mounted
  loop: "{{ btrfs_subvolumes }}"

- name: Ensure subvolume permissions after mounting
  become: true
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('olivier') }}"
    group: "{{ item.group | default('olivier') }}"
  loop: "{{ btrfs_subvolumes }}"

- name: Remove legacy fake fstab file if present
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}/.fakefstab"
    state: absent

- name: Copy snapshot script
  when: ansible_distribution in ['Debian', 'Ubuntu']
  ansible.builtin.copy:
    src: "snapshot.sh"
    dest: "{{ crypto_base_dir }}/snapshot.sh"
    mode: "0755"

- name: Install snapshot script in crontab
  ansible.builtin.cron:
    name: "snapshot data"
    user: "olivier"
    hour: "5"
    minute: "0"
    job: "{{ crypto_base_dir }}/snapshot.sh"
