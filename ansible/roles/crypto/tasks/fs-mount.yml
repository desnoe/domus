---
- name: "Ensure Btrfs subvolumes exist: {{ crypto_disk_name }}"
  become: true
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      tmpdir=$(mktemp -d)
      trap 'umount "$tmpdir" 2>/dev/null || true; rmdir "$tmpdir" 2>/dev/null || true' EXIT
      mount -o noatime,subvolid=5 LABEL={{ crypto_disk_name }} "$tmpdir"
      created=0
      {% for subvol in crypto_disk_subvolumes %}
      {% set subvol_name = subvol | regex_replace('^/+', '') | regex_replace('/+$', '') | replace('/', '_') %}
      if ! btrfs subvolume show "$tmpdir/{{ subvol_name }}" >/dev/null 2>&1; then
        btrfs subvolume create "$tmpdir/{{ subvol_name }}"
        created=1
      fi
      {% endfor %}
      exit $((created == 1 ? 100 : 0))
  register: crypto_btrfs_subvol_create
  changed_when: crypto_btrfs_subvol_create.rc == 100
  failed_when: crypto_btrfs_subvol_create.rc not in [0, 100]

- name: "Ensure subvolume mount directories exist: {{ crypto_disk_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop: "{{ crypto_disk_subvolumes }}"

- name: "Mount Btrfs subvolumes in fstab: {{ crypto_disk_name }}"
  become: true
  ansible.posix.mount:
    path: "{{ item }}"
    src: "LABEL={{ crypto_disk_name }}"
    fstype: btrfs
    opts: "{{ crypto_btrfs_default_mount_options }},subvol={{ item | regex_replace('^/+', '') | regex_replace('/+$', '') | replace('/', '_') }}"
    boot: false
    state: mounted
  loop: "{{ crypto_disk_subvolumes }}"

- name: "Ensure subvolume permissions after mounting: {{ crypto_disk_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop: "{{ crypto_disk_subvolumes }}"

- name: "Remove legacy cron scrub job: {{ crypto_disk_name }}"
  become: true
  ansible.builtin.cron:
    name: "btrfs scrub {{ crypto_disk_name }}"
    state: absent

- name: "Resolve systemd mount unit name for scrub target: {{ crypto_disk_name }}"
  become: true
  ansible.builtin.command:
    argv:
      - systemd-escape
      - --path
      - --suffix=mount
      - "{{ crypto_disk_subvolumes[0] | regex_replace('/+$', '') }}"
  register: crypto_scrub_mount_unit_cmd
  changed_when: false
  check_mode: false

- name: "Deploy Btrfs scrub systemd service unit: {{ crypto_disk_name }}"
  when: crypto_scrub_enabled | bool
  become: true
  ansible.builtin.template:
    src: btrfs-scrub.service.j2
    dest: "/etc/systemd/system/btrfs-scrub-{{ crypto_disk_name }}.service"
    owner: root
    group: root
    mode: "0644"

- name: "Deploy Btrfs scrub systemd timer unit: {{ crypto_disk_name }}"
  when: crypto_scrub_enabled | bool
  become: true
  ansible.builtin.template:
    src: btrfs-scrub.timer.j2
    dest: "/etc/systemd/system/btrfs-scrub-{{ crypto_disk_name }}.timer"
    owner: root
    group: root
    mode: "0644"

- name: "Enable and start Btrfs scrub systemd timer: {{ crypto_disk_name }}"
  when: crypto_scrub_enabled | bool
  become: true
  ansible.builtin.systemd_service:
    name: "btrfs-scrub-{{ crypto_disk_name }}.timer"
    daemon_reload: true
    enabled: true
    state: started
