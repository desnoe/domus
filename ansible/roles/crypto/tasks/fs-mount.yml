---
- name: Check crypto base directory
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}"
    state: directory
    mode: "0755"
    owner: olivier
    group: olivier

- name: Check if fake fstab exists
  ansible.builtin.stat:
    path: "{{ crypto_base_dir }}/.fakefstab"
  register: fakefstab

- name: Create fake fstab
  become: true
  ansible.builtin.file:
    state: touch
    path: "{{ crypto_base_dir }}/.fakefstab"
    mode: "0644"
  when: not fakefstab.stat.exists

- name: Mount sync directory
  become: true
  ansible.posix.mount:
    path: "{{ crypto_base_dir }}/sync"
    src: /dev/vg_data/lv_data
    fstype: btrfs
    fstab: "{{ crypto_base_dir }}/.fakefstab"
    opts: "noauto,subvol=sync"
    state: mounted

- name: Ensure sync directory permissions
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}/sync"
    state: directory
    mode: "0755"
    owner: olivier
    group: olivier

- name: Mount snapshots directory
  become: true
  ansible.posix.mount:
    path: "{{ crypto_base_dir }}/snapshots"
    src: /dev/vg_data/lv_data
    fstype: btrfs
    fstab: "{{ crypto_base_dir }}/.fakefstab"
    opts: "noauto,subvol=snapshots"
    state: mounted

- name: Ensure snapshots directory permissions
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}/snapshots"
    state: directory
    mode: "0755"
    owner: olivier
    group: olivier

- name: Copy snapshot script
  when: ansible_distribution in ['Debian', 'Ubuntu']
  ansible.builtin.copy:
    src: "snapshot.sh"
    dest: "{{ crypto_base_dir }}/snapshot.sh"
    mode: "0755"

- name: Install snapshot script in crontab
  ansible.builtin.cron:
    name: "snapshot data"
    user: "olivier"
    hour: "5"
    minute: "0"
    job: "{{ crypto_base_dir }}/snapshot.sh"
