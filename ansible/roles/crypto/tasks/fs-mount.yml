---

- name: "check crypto base dir"
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}"
    state: directory
    mode: 0755
    owner: olivier
    group: olivier

- name: create temporary directory
  ansible.builtin.tempfile:
    state: directory
  register: tmpdir
  changed_when: false

- name: check if fake fstab exists or not
  ansible.builtin.stat:
    path: "{{ crypto_base_dir }}/.fakefstab"
  register: fakefstab

- name: create fake fstab
  become: true
  ansible.builtin.file:
    state: touch
    path: "{{ crypto_base_dir }}/.fakefstab"
  when: not fakefstab.stat.exists

- name: mount up the btrfs filesystem temporarily
  become: true
  ansible.posix.mount:
    name: "{{ tmpdir.path }}"
    src: /dev/vg_data/lv_data
    fstype: btrfs
    fstab: "{{ crypto_base_dir }}/.fakefstab"
    state: mounted
  changed_when: false

- name: get btrfs subvolume list
  become: true
  command: btrfs subvolume list "{{ tmpdir.path }}"
  register: btrfs_subvolumelist
  changed_when: false

- name: get btrfs subvolume IDs
  set_fact:
    btrfs_subvolumeid_sync: "{{ btrfs_subvolumelist.stdout | regex_search('ID (\\d+) .* sync$', '\\1', multiline=True) | first }}"
    btrfs_subvolumeid_snapshots: "{{ btrfs_subvolumelist.stdout | regex_search('ID (\\d+) .* snapshots$', '\\1', multiline=True) | first }}"
  changed_when: false

- name: unmount the btrfs filesystem
  become: true
  ansible.posix.mount:
    name: "{{ tmpdir.path }}"
    state: unmounted
  changed_when: false

- name: remove temporary directory
  ansible.builtin.file:
    path: "{{ tmpdir.path }}"
    state: absent
  changed_when: false

- name: "mount sync dir"
  become: true
  ansible.posix.mount:
    name: "{{ crypto_base_dir }}/sync/"
    src: /dev/vg_data/lv_data
    fstype: btrfs
    fstab: "{{ crypto_base_dir }}/.fakefstab"
    opts: "noauto,subvolid={{ btrfs_subvolumeid_sync }}"
    state: mounted

- name: "check sync base dir"
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}/sync"
    state: directory
    mode: 0755
    owner: olivier
    group: olivier

- name: "mount snapshots dir"
  become: true
  ansible.posix.mount:
    name: "{{ crypto_base_dir }}/snapshots/"
    src: /dev/vg_data/lv_data
    fstype: btrfs
    fstab: "{{ crypto_base_dir }}/.fakefstab"
    opts: "noauto,subvolid={{ btrfs_subvolumeid_snapshots }}"
    state: mounted

- name: "check snapshots base dir"
  become: true
  ansible.builtin.file:
    path: "{{ crypto_base_dir }}/snapshots"
    state: directory
    mode: 0755
    owner: olivier
    group: olivier

- name: "copy snapshot script"
  when: ansible_distribution == "Debian" or ansible_distribution == "Ubuntu"
  copy:
    src: "snapshot.sh"
    dest: "{{ crypto_base_dir }}/"
    mode: 0755

- name: "install snapshot script in crontab"
  cron:
    name: "snapshot data"
    user: "olivier"
    hour: "5"
    minute: "0"
    job: "{{ crypto_base_dir }}/snapshot.sh"

