---
- name: Install required packages
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    name:
      - htop
    state: present

- name: Check htop base config dir
  ansible.builtin.file:
    path: "~/.config/htop"
    state: directory
    mode: "0700"

- name: Setup htoprc
  ansible.builtin.copy:
    src: "htoprc"
    dest: "~/.config/htop/htoprc"
    mode: "0644"
