---
- name: Install required packages
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    name:
      - htop
    state: present

- name: Check htop base config dir
  become: true
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/htop"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Setup htoprc
  become: true
  ansible.builtin.copy:
    src: "htoprc"
    dest: "/home/{{ ansible_user }}/.config/htop/htoprc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    force: false
