---
- name: Query system hostnamectl status
  become: true
  ansible.builtin.command:
    cmd: hostnamectl status
  register: base_hostnamectl_cmd
  changed_when: false
  failed_when: false

- name: Query system uptime and load average
  become: true
  ansible.builtin.command:
    cmd: uptime
  register: base_uptime_cmd
  changed_when: false
  failed_when: false

- name: Display Base System Status Summary
  ansible.builtin.debug:
    msg: |-
      =======================================================
      BASE SYSTEM STATUS REPORT: {{ inventory_hostname }}
      =======================================================
      {{ base_hostnamectl_cmd.stdout | default('hostnamectl unavailable.', true) | regex_replace('[^\x00-\x7f]+', '') }}
      Uptime: {{ base_uptime_cmd.stdout | default('unavailable', true) | trim }}
      =======================================================
