---
- name: Install list of base packages
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - bash-completion
      - curl
      - git
      - man-db
      - net-tools
      - rsync
      - telnet
      - tree
      - unzip
      - xauth
      - wget

- name: Generate /etc/hostname
  become: true
  ansible.builtin.template:
    src: hostname.j2
    dest: /etc/hostname
    mode: "0644"

- name: Setup .bashrc for root
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.copy:
    src: "bashrc.root"
    dest: "/root/.bashrc"
    owner: root
    group: root
    mode: "0644"

- name: Setup .bashrc for user
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.copy:
    src: "bashrc"
    dest: "/home/{{ ansible_user }}/.bashrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
