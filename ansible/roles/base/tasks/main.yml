---
- name: Install list of base packages
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - bash-completion
      - curl
      - git
      - man-db
      - rsync
      - tree
      - unzip
      - wget

- name: Configure system hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ inventory_hostname_short }}"

- name: Ensure 127.0.1.1 in /etc/hosts matches inventory hostname
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1\t{{ inventory_hostname }}\t{{ inventory_hostname_short }}"
    owner: root
    group: root
    mode: "0644"

- name: Setup .bashrc for root
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.copy:
    src: "bashrc.root"
    dest: "/root/.bashrc"
    owner: root
    group: root
    mode: "0644"

- name: Setup .bashrc for user
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.copy:
    src: "bashrc"
    dest: "/home/{{ ansible_user }}/.bashrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# Pre-create remote temporary directories to silence Ansible warning
# "Authentication or permission failure... remote_tmp did not exist and was created with a mode of 0700"
- name: Ensure Ansible remote temporary directory exists for root
  become: true
  ansible.builtin.file:
    path: /root/.ansible/tmp
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure Ansible remote temporary directory exists for user
  become: true
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.ansible/tmp"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
