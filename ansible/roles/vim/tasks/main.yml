---
- name: Install vim package
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    name:
      - vim
    state: present

- name: Setup .vimrc for root
  become: true
  ansible.builtin.copy:
    src: "vimrc"
    dest: "/root/.vimrc"
    mode: "0644"

- name: Setup .vimrc for user
  ansible.builtin.copy:
    src: "vimrc"
    dest: "~/.vimrc"
    mode: "0644"
