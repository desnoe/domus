---

- name: "install required packages"
  when: ansible_distribution == "Debian" or ansible_distribution == "Ubuntu"
  become: true
  apt:
    name: "{{ item }}"
    state: present
  with_items:
    - vim

- name: "setup .vimrc for root"
  become: true
  copy:
    src: "vimrc"
    dest: "/root/.vimrc"
    mode: 0644

- name: "setup .vimrc"
  copy:
    src: "vimrc"
    dest: "~/.vimrc"
    mode: 0644
