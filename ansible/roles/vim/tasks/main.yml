---
- name: Install vim package
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.apt:
    name:
      - vim
    state: present

- name: Set vim.basic as default system editor
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  community.general.alternatives:
    name: editor
    path: /usr/bin/vim.basic

- name: Setup .vimrc for root
  become: true
  ansible.builtin.copy:
    src: "vimrc"
    dest: "/root/.vimrc"
    owner: root
    group: root
    mode: "0644"

- name: Setup .vimrc for user
  become: true
  ansible.builtin.copy:
    src: "vimrc"
    dest: "/home/{{ ansible_user }}/.vimrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
