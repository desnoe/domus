---
- name: Ensure bin directory exists
  become: true
  ansible.builtin.file:
    path: "/home/{{ snapshot_user }}/bin"
    state: directory
    mode: "0755"
    owner: "{{ snapshot_user }}"
    group: "{{ snapshot_user }}"

- name: Copy snapshot script
  when: ansible_distribution in ['Debian', 'Ubuntu']
  ansible.builtin.copy:
    src: "snapshot.sh"
    dest: "/home/{{ snapshot_user }}/bin/snapshot.sh"
    mode: "0755"
    owner: "{{ snapshot_user }}"
    group: "{{ snapshot_user }}"

- name: "Configure Btrfs snapshot cron: {{ item.name }}"
  ansible.builtin.cron:
    name: "snapshot {{ item.name }}"
    user: "{{ snapshot_user }}"
    hour: "{{ item.hour | default('5') }}"
    minute: "{{ item.minute | default('0') }}"
    job: >-
      /home/{{ snapshot_user }}/bin/snapshot.sh {{ item.source }} {{ item.destination }}{%- if item.keep_daily is defined or item.keep_weekly is defined %}
      {{ item.keep_daily | default(snapshot_keep_daily) }} {{ item.keep_weekly | default(snapshot_keep_weekly) }}{% endif %}
  loop: "{{ snapshot_jobs | default([]) }}"
