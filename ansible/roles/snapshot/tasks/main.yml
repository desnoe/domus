---
- name: Ensure bin directory exists
  become: true
  ansible.builtin.file:
    path: "/home/{{ snapshot_user }}/bin"
    state: directory
    mode: "0755"
    owner: "{{ snapshot_user }}"
    group: "{{ snapshot_user }}"

- name: Copy Btrfs snapshot script
  when: ansible_distribution in ['Debian', 'Ubuntu']
  become: true
  ansible.builtin.copy:
    src: "snapshot.sh"
    dest: "/home/{{ snapshot_user }}/bin/snapshot.sh"
    mode: "0755"
    owner: "{{ snapshot_user }}"
    group: "{{ snapshot_user }}"

- name: "Deploy Btrfs snapshot systemd service unit: {{ item.name }}"
  become: true
  ansible.builtin.template:
    src: btrfs-snapshot.service.j2
    dest: >-
      /etc/systemd/system/btrfs-snapshot-{{
        item.name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '')
      }}.service
    mode: "0644"
    owner: root
    group: root
  loop: "{{ snapshot_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Deploy Btrfs snapshot systemd timer unit: {{ item.name }}"
  become: true
  ansible.builtin.template:
    src: btrfs-snapshot.timer.j2
    dest: >-
      /etc/systemd/system/btrfs-snapshot-{{
        item.name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '')
      }}.timer
    mode: "0644"
    owner: root
    group: root
  loop: "{{ snapshot_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Enable and start Btrfs snapshot systemd timer: {{ item.name }}"
  become: true
  ansible.builtin.systemd_service:
    name: >-
      btrfs-snapshot-{{
        item.name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '')
      }}.timer
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ snapshot_jobs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
