---
- name: Query Btrfs snapshot systemd timers  # noqa: command-instead-of-module
  when: (snapshot_jobs | default([])) | length > 0
  ansible.builtin.command:
    cmd: "systemctl list-timers --all --no-pager 'btrfs-snapshot-*'"
  register: snapshot_timers_cmd
  changed_when: false
  failed_when: false

- name: Query recent Btrfs snapshot journal entries
  when: (snapshot_jobs | default([])) | length > 0
  ansible.builtin.command:
    cmd: "journalctl -u 'btrfs-snapshot-*.service' -n 15 --no-pager"
  register: snapshot_journal_cmd
  changed_when: false
  failed_when: false

- name: Query recent Btrfs snapshots on disk
  when: (snapshot_jobs | default([])) | length > 0
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      ls -td {% for job in snapshot_jobs %}{{ job.destination }}/* {% endfor %}2>/dev/null | head -n 5
  register: snapshot_recent_snapshots_cmd
  changed_when: false
  failed_when: false

- name: Display Btrfs Snapshots Status Report
  when: (snapshot_jobs | default([])) | length > 0
  ansible.builtin.debug:
    msg: |
      =======================================================
      BTRFS SNAPSHOTS REPORT: {{ inventory_hostname }}
      =======================================================
      Recent Snapshots on Disk:
      {{ snapshot_recent_snapshots_cmd.stdout | default('No snapshots found.', true) }}
      -------------------------------------------------------
      Systemd Timers:
      {{ snapshot_timers_cmd.stdout | default('No snapshot timers found.', true) }}
      -------------------------------------------------------
      Recent Journal Logs (btrfs-snapshot-*.service):
      {{ snapshot_journal_cmd.stdout | default('No journal entries found.', true) }}
      =======================================================
