---
- name: Ensure 'wheel' group exists
  become: true
  ansible.builtin.group:
    name: wheel
    state: present

- name: Allow 'wheel' group passwordless sudo via drop-in file
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-ansible-wheel
    content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Clean up legacy wheel configuration from /etc/sudoers
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    regexp: '^%wheel'
    state: absent
    validate: "visudo -cf %s"

- name: Configure user olivier with wheel group membership
  become: true
  no_log: true
  ansible.builtin.user:
    name: olivier
    password: "{{ user_password }}"
    comment: "Olivier Desnoe"
    groups:
      - wheel
    append: true
    state: present
    createhome: true
    shell: /bin/bash
