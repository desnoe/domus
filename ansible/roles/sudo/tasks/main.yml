---
- name: Ensure 'wheel' group exists
  become: true
  ansible.builtin.group:
    name: wheel
    state: present

- name: Allow 'wheel' group passwordless sudo via drop-in file
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-ansible-wheel
    content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: "Configure user {{ ansible_user }} with wheel group membership"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - wheel
    append: true
    state: present
    createhome: true
    shell: /bin/bash
