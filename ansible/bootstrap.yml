---
- name: Bootstrap base system access and security
  hosts: all
  become: true
  become_user: root
  become_method: ansible.builtin.su
  roles:
    - apt
    - sudo
    - sshd
  post_tasks:
    - name: Reset connection to apply user group and ssh changes
      ansible.builtin.meta: reset_connection

- name: Import system baseline configuration
  ansible.builtin.import_playbook: system.yml
