---
- name: Configure system base services and security
  hosts: all
  become: true
  roles:
    - apt
    - base
    - htop
    - locales
    - ntp
    - sshd
    - sudo
    - ufw
    - vim
    - role: alloy
      tags:
        - alloy

- name: Configure GitHub Actions self-hosted runner
  hosts: runner
  become: true
  roles:
    - runner

- name: Configure Samba file sharing with Previous Versions
  hosts: crypto
  become: true
  roles:
    - role: samba
      tags:
        - samba
