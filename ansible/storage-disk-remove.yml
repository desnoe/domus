---
- name: Remove member disk from encrypted Btrfs storage pool
  hosts: crypto
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Verify storage pools are defined
      when: (crypto_disks | default([])) | length == 0
      ansible.builtin.fail:
        msg: "No crypto_disks defined for this host."

    - name: Display available storage pools
      when: pool is not defined
      ansible.builtin.debug:
        msg: >-
          Configured storage pools on {{ inventory_hostname }}:
          {{ crypto_disks | map(attribute='name') | list | join(', ') }}

    - name: Prompt for target pool name
      when: pool is not defined
      ansible.builtin.pause:
        prompt: "Enter the name of the storage pool to remove a disk from"
      register: prompt_pool_input

    - name: Set resolved target pool fact
      ansible.builtin.set_fact:
        target_remove_pool: "{{ pool | default((prompt_pool_input.user_input | default('')) | trim) }}"

    - name: Validate target pool exists in crypto_disks
      when: target_remove_pool not in (crypto_disks | map(attribute='name') | list)
      ansible.builtin.fail:
        msg: >-
          Pool '{{ target_remove_pool }}' does not exist in crypto_disks for {{ inventory_hostname }}.
          Available pools: {{ crypto_disks | map(attribute='name') | list | join(', ') }}

    - name: Set target pool dictionary fact
      ansible.builtin.set_fact:
        target_pool_dict: "{{ (crypto_disks | selectattr('name', 'equalto', target_remove_pool) | list | first) }}"

    - name: Validate pool has multiple member devices
      when: target_pool_dict.devices | length <= 1
      ansible.builtin.fail:
        msg: >-
          Pool '{{ target_remove_pool }}' has only 1 member device ({{ target_pool_dict.devices[0] }}).
          To permanently destroy and remove an entire pool, use storage-remove.yml.

    - name: Display active member devices in pool
      when:
        - disk_index is not defined
        - device is not defined
      ansible.builtin.debug:
        msg: >-
          Member devices in pool '{{ target_remove_pool }}':
          {% for d in target_pool_dict.devices %}
          [{{ loop.index0 }}] {{ d }} (/dev/mapper/{{ target_remove_pool }}-{{ loop.index0 }})
          {% endfor %}

    - name: Prompt for member disk index to remove
      when:
        - disk_index is not defined
        - device is not defined
      ansible.builtin.pause:
        prompt: "Enter the index (0..{{ target_pool_dict.devices | length - 1 }}) of the member disk to remove"
      register: prompt_disk_idx_input

    - name: Set target remove index from disk_index
      when: disk_index is defined
      ansible.builtin.set_fact:
        target_remove_idx: "{{ disk_index | int }}"

    - name: Set target remove index from device path
      when:
        - disk_index is not defined
        - device is defined
      ansible.builtin.set_fact:
        target_remove_idx: "{{ target_pool_dict.devices.index(device) if (device in target_pool_dict.devices) else -1 }}"

    - name: Set target remove index from interactive prompt
      when:
        - disk_index is not defined
        - device is not defined
      ansible.builtin.set_fact:
        target_remove_idx: "{{ prompt_disk_idx_input.user_input | default('') | trim | int }}"

    - name: Validate resolved member disk index bounds
      when: target_remove_idx | int < 0 or target_remove_idx | int >= (target_pool_dict.devices | length)
      ansible.builtin.fail:
        msg: >-
          Invalid disk index '{{ target_remove_idx }}' for pool '{{ target_remove_pool }}'.
          Valid range: 0..{{ target_pool_dict.devices | length - 1 }}.

    - name: Set resolved target remove device fact
      ansible.builtin.set_fact:
        target_remove_device: "{{ target_pool_dict.devices[target_remove_idx | int] }}"

    - name: Safety confirmation prompt for disk removal
      when: not (confirm_remove | default(false) | bool)
      ansible.builtin.pause:
        prompt: >-
          WARNING: This will permanently wipe member disk {{ target_remove_device }}
          (/dev/mapper/{{ target_remove_pool }}-{{ target_remove_idx }}) and reduce redundancy
          in pool '{{ target_remove_pool }}' on {{ inventory_hostname }}. Type 'REMOVE' to proceed
      register: remove_confirm_prompt

    - name: Verify disk removal safety confirmation
      when:
        - not (confirm_remove | default(false) | bool)
        - (remove_confirm_prompt.user_input | default('')) != 'REMOVE'
      ansible.builtin.fail:
        msg: "Aborting: Disk removal confirmation not given ('REMOVE' required, or confirm_remove=yes extra var)."

  tasks:
    - name: Execute disk removal workflow
      ansible.builtin.include_role:
        name: crypto
        tasks_from: disk-remove
      vars:
        crypto_target_pool: "{{ target_remove_pool }}"
        crypto_remove_idx: "{{ target_remove_idx }}"
