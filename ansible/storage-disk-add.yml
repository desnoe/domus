---
- name: Add member disk to encrypted Btrfs storage pool
  hosts: crypto
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Verify storage pools are defined
      when: (crypto_disks | default([])) | length == 0
      ansible.builtin.fail:
        msg: "No crypto_disks defined for this host."

    - name: Display available storage pools
      when: pool is not defined
      ansible.builtin.debug:
        msg: >-
          Configured storage pools on {{ inventory_hostname }}:
          {{ crypto_disks | map(attribute='name') | list | join(', ') }}

    - name: Prompt for target pool name
      when: pool is not defined
      ansible.builtin.pause:
        prompt: "Enter the name of the storage pool to add a disk to"
      register: prompt_pool_input

    - name: Set resolved target pool fact
      ansible.builtin.set_fact:
        target_add_pool: "{{ pool | default((prompt_pool_input.user_input | default('')) | trim) }}"

    - name: Validate target pool exists in crypto_disks
      when: target_add_pool not in (crypto_disks | map(attribute='name') | list)
      ansible.builtin.fail:
        msg: >-
          Pool '{{ target_add_pool }}' does not exist in crypto_disks for {{ inventory_hostname }}.
          Available pools: {{ crypto_disks | map(attribute='name') | list | join(', ') }}

    - name: Set target pool dictionary fact
      ansible.builtin.set_fact:
        target_pool_dict: "{{ (crypto_disks | selectattr('name', 'equalto', target_add_pool) | list | first) }}"

    - name: Check LUKS formatting of configured pool devices
      when: device is not defined
      become: true
      ansible.builtin.command:
        cmd: "cryptsetup isLuks {{ item }}"
      loop: "{{ target_pool_dict.devices }}"
      loop_control:
        index_var: dev_idx
      register: target_pool_isluks_cmds
      changed_when: false
      failed_when: false

    - name: Identify unformatted device candidate from host_vars
      when:
        - device is not defined
        - (target_pool_isluks_cmds.results | selectattr('rc', 'ne', 0) | list | length) > 0
      ansible.builtin.set_fact:
        detected_unformatted_dev: "{{ (target_pool_isluks_cmds.results | selectattr('rc', 'ne', 0) | list | first).item }}"
        detected_unformatted_idx: "{{ (target_pool_isluks_cmds.results | selectattr('rc', 'ne', 0) | list | first).dev_idx }}"

    - name: Prompt for physical device path to add
      when:
        - device is not defined
        - detected_unformatted_dev is not defined
      ansible.builtin.pause:
        prompt: >-
          All devices in host_vars for '{{ target_add_pool }}' are already formatted.
          Enter the physical device path of the new disk to add (e.g. /dev/disk/by-id/... or /dev/sde)
      register: prompt_device_input

    - name: Determine next available mapper index for pool
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          idx=0
          while [ -e "/dev/mapper/{{ target_add_pool }}-$idx" ]; do
            idx=$((idx + 1))
          done
          echo "$idx"
      register: detected_next_avail_idx_cmd
      changed_when: false

    - name: Set resolved target device facts
      ansible.builtin.set_fact:
        target_add_device: "{{ device | default(detected_unformatted_dev | default((prompt_device_input.user_input | default('')) | trim)) }}"
        target_new_idx: "{{ detected_unformatted_idx | default(detected_next_avail_idx_cmd.stdout | trim) }}"

    - name: Validate target device path was provided
      when: target_add_device | length == 0
      ansible.builtin.fail:
        msg: "Aborting: No target device specified."

    - name: Safety confirmation prompt for disk addition
      when: not (confirm_add | default(false) | bool)
      ansible.builtin.pause:
        prompt: >-
          About to format LUKS on {{ target_add_device }} and add it as mapper
          {{ target_add_pool }}-{{ target_new_idx }} to pool '{{ target_add_pool }}' on {{ inventory_hostname }}.
          Type 'yes' to proceed
      register: add_confirm_prompt

    - name: Verify disk addition safety confirmation
      when:
        - not (confirm_add | default(false) | bool)
        - (add_confirm_prompt.user_input | default('')) != 'yes'
      ansible.builtin.fail:
        msg: "Aborting: Disk addition confirmation not given ('yes' required, or confirm_add=yes extra var)."

  tasks:
    - name: Execute disk addition workflow
      ansible.builtin.include_role:
        name: crypto
        tasks_from: disk-add
      vars:
        crypto_target_pool: "{{ target_add_pool }}"
        crypto_add_device: "{{ target_add_device }}"
        crypto_new_dev_idx: "{{ target_new_idx }}"
        crypto_full_balance: "{{ full_balance | default(false) | bool }}"
