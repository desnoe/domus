---
crypto_disks:
  - name: data
    devices:
      - /dev/sda
    subvolumes:
      - "/home/{{ ansible_user }}/data/sync"
      - "/home/{{ ansible_user }}/data/snapshots"

snapshot_jobs:
  - name: data
    source: "/home/{{ ansible_user }}/data/sync"
    destination: "/home/{{ ansible_user }}/data/snapshots"

rclone_jobs:
  - provider: onedrive
    bucket: ""
    destination: "/home/{{ ansible_user }}/data/sync"
  - provider: S3
    bucket: www.albatross-networks.com
    destination: "/home/{{ ansible_user }}/data/sync"
  - provider: S3
    bucket: delarche-images
    destination: "/home/{{ ansible_user }}/data/sync"

samba_shares:
  - name: data
    path: "/home/{{ ansible_user }}/data/sync"
    snapdir: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data with Previous Versions"
