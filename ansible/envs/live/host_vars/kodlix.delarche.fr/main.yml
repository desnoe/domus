---
crypto_disks:
  - name: data
    devices:
      - /dev/sda
    subvolumes:
      - "/home/{{ ansible_user }}/data/sync"
      - "/home/{{ ansible_user }}/data/snapshots"

snapshot_jobs:
  - name: data
    source: "/home/{{ ansible_user }}/data/sync"
    destination: "/home/{{ ansible_user }}/data/snapshots"

rclone_jobs:
  - name: onedrive
    source:
      provider: onedrive
    destination:
      mount: "/home/{{ ansible_user }}/data/sync"
    extra_args:
      - '--user-agent="ISV|rclone.org|rclone/v1.67.0"'
  - name: s3-www-albatross-networks-com
    source:
      provider: S3
      path: www.albatross-networks.com
    destination:
      mount: "/home/{{ ansible_user }}/data/sync"
  - name: s3-delarche-images
    source:
      provider: S3
      path: delarche-images
    destination:
      mount: "/home/{{ ansible_user }}/data/sync"

samba_shares:
  - name: data
    path: "/home/{{ ansible_user }}/data/sync"
    snapdir: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data"
  - name: data-snapshots
    path: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data snapshots"
