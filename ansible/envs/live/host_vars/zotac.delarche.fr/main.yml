---
crypto_disks:
  - name: data
    devices:
      - /dev/disk/by-id/ata-Samsung_SSD_860_EVO_2TB_S3YVNB0KB16855X
    subvolumes:
      - "/home/{{ ansible_user }}/data/sync"
      - "/home/{{ ansible_user }}/data/snapshots"
  # Btrfs RAID1 over 2 TB + 2 TB + 8 TB => ~4 TB usable (bounded by largest member).
  # Btrfs RAID1 over 2 TB + 2 TB + 8 TB + 3 TB => ~4.5 TB usable.
  # External USB 4-bay dock: use stable /dev/disk/by-id/usb-* links to ensure
  # permanent, reliable enumeration immune to USB 2.0 SAT/ata_id quirks.
  - name: backup
    devices:
      - /dev/disk/by-id/usb-ST2000DL_003-9VT166_0000000000000002-0:0  # Bay 2: 5YD49469
      - /dev/disk/by-id/usb-ST2000DL_003-9VT166_0000000000000001-0:0  # Bay 1: 5YD4997K
      - /dev/disk/by-id/usb-TOSHIBA_HDWG180_0000000000000004-0:0        # Bay 4: 7160A0A6FBEG
      - /dev/disk/by-id/usb-ST3000NC_002-1DY166_0000000000000003-0:0  # Bay 3: Z1F4NKYK
    subvolumes:
      - "/home/{{ ansible_user }}/backup/sync"
      - "/home/{{ ansible_user }}/backup/snapshots"

crypto_no_compression_paths:
  - "/home/{{ ansible_user }}/backup/sync/googledrive/macbookpro"

snapshot_jobs:
  - name: data
    source: "/home/{{ ansible_user }}/data/sync"
    destination: "/home/{{ ansible_user }}/data/snapshots"
  - name: backup
    source: "/home/{{ ansible_user }}/backup/sync"
    destination: "/home/{{ ansible_user }}/backup/snapshots"

samba_shares:
  - name: data
    path: "/home/{{ ansible_user }}/data/sync"
    snapdir: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data"
  - name: data-snapshots
    path: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data snapshots"
  - name: backup
    path: "/home/{{ ansible_user }}/backup/sync"
    snapdir: "/home/{{ ansible_user }}/backup/snapshots"
    comment: "Btrfs backup"
  - name: backup-snapshots
    path: "/home/{{ ansible_user }}/backup/snapshots"
    comment: "Btrfs backup snapshots"

rclone_jobs:
  - name: googledrive
    source:
      provider: GoogleDrive
    destination:
      mount: "/home/{{ ansible_user }}/backup/sync"
      path: "googledrive/mydrive"
    extra_args:
      - --drive-skip-gdocs
  - name: googledrive-macbookpro
    source:
      provider: GoogleDrive-MacBookPro
    destination:
      mount: "/home/{{ ansible_user }}/backup/sync"
      path: "googledrive/macbookpro"
    filters:
      - "- **.lrdata/**"
    extra_args:
      - --drive-skip-gdocs
