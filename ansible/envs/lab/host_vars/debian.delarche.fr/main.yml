---
crypto_disks:
  - name: data
    devices:
      - /dev/disk/by-id/ata-debian-1_SSD_GQ84JJWKHCDM5B354NNT
      - /dev/disk/by-id/ata-debian-2_SSD_08X5T79BNBFM36W6GT86
  - name: backup
    devices:
      - /dev/disk/by-id/ata-debian-3_SSD_5E6AYTKT29XMK1XHWJ78
      - /dev/disk/by-id/ata-debian-4_SSD_NWWFF9EGT4W4F6PE4PFK
    subvolumes:
      - name: sync

snapshot_jobs:
  - name: data
    source: "{{ crypto_base_dir }}/data/sync"
    destination: "{{ crypto_base_dir }}/data/snapshots"

rclone_jobs:
  - provider: onedrive
    bucket: ""
  - provider: S3
    bucket: www.albatross-networks.com
  - provider: S3
    bucket: delarche-images
