---
crypto_disks:
  - name: data
    devices:
      - /dev/disk/by-id/ata-debian-1_SSD_GQ84JJWKHCDM5B354NNT
      - /dev/disk/by-id/ata-debian-2_SSD_08X5T79BNBFM36W6GT86
    subvolumes:
      - "/home/{{ ansible_user }}/data/sync"
      - "/home/{{ ansible_user }}/data/snapshots"
  - name: backup
    devices:
      - /dev/disk/by-id/ata-debian-3_SSD_5E6AYTKT29XMK1XHWJ78
      - /dev/disk/by-id/ata-debian-4_SSD_NWWFF9EGT4W4F6PE4PFK
    subvolumes:
      - "/home/{{ ansible_user }}/backup/sync"
      - "/home/{{ ansible_user }}/backup/snapshots"


snapshot_jobs:
  - name: data
    source: "/home/{{ ansible_user }}/data/sync"
    destination: "/home/{{ ansible_user }}/data/snapshots"
  - name: backup
    source: "/home/{{ ansible_user }}/backup/sync"
    destination: "/home/{{ ansible_user }}/backup/snapshots"

rclone_jobs:
  - name: onedrive-share-50ans
    source:
      provider: OneDrive
      path: Share/50ans
    destination:
      mount: "/home/{{ ansible_user }}/data/sync"
    extra_args:
      - '--user-agent="ISV|rclone.org|rclone/v1.67.0"'
  - name: onedrive-share-50ans-backup
    source:
      provider: OneDrive
      path: Share/50ans
    destination:
      mount: "/home/{{ ansible_user }}/backup/sync"
      path: onedrive/50ans
    extra_args:
      - '--user-agent="ISV|rclone.org|rclone/v1.67.0"'
  - name: s3-www-albatross-networks-com
    source:
      provider: S3
      path: www.albatross-networks.com
    destination:
      mount: "/home/{{ ansible_user }}/data/sync"
  - name: s3-delarche-images
    source:
      provider: S3
      path: delarche-images
    destination:
      mount: "/home/{{ ansible_user }}/data/sync"

samba_shares:
  - name: data
    path: "/home/{{ ansible_user }}/data/sync"
    snapdir: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data"
  - name: data-snapshots
    path: "/home/{{ ansible_user }}/data/snapshots"
    comment: "Btrfs data snapshots"
  - name: backup
    path: "/home/{{ ansible_user }}/backup/sync"
    snapdir: "/home/{{ ansible_user }}/backup/snapshots"
    comment: "Btrfs backup"
  - name: backup-snapshots
    path: "/home/{{ ansible_user }}/backup/snapshots"
    comment: "Btrfs backup snapshots"
