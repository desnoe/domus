---
- name: Report storage and backup status
  hosts: crypto
  become: true
  gather_facts: true

  tasks:
    - name: Report storage pool status
      ansible.builtin.include_role:
        name: crypto
        tasks_from: status
        apply:
          tags:
            - crypto
            - status
      tags:
        - crypto
        - status

    - name: Report Btrfs snapshots status
      ansible.builtin.include_role:
        name: snapshot
        tasks_from: status
        apply:
          tags:
            - snapshot
            - status
      tags:
        - snapshot
        - status

    - name: Report cloud backup logs status
      ansible.builtin.include_role:
        name: rclone
        tasks_from: status
        apply:
          tags:
            - rclone
            - status
      tags:
        - rclone
        - status
