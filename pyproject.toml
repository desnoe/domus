[project]
name = "homecode"
version = "0.1.0"
description = "Home servers and services management with Ansible"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ansible-core>=2.17.0,<2.18.0",
    "ansible-lint>=24.7.0",
    "yamllint>=1.35.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
