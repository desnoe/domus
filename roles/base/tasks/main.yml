---

- name: "install list of base packages"
  when: ansible_distribution == "Debian" or ansible_distribution == "Ubuntu"
  become: true
  apt:
    name: "{{ item }}"
    state: present
  with_items:
    - wget
    - curl
    - unzip
    - xauth
    - telnet
    - bash-completion
    - net-tools
    - git
    - tree

- name: "generate /etc/hostname"
  become: true
  template:
    src: hostname.j2
    dest: /etc/hostname
    mode: 0644

- name: "setup .bashrc for root"
  when: ansible_distribution == "Debian" or ansible_distribution == "Ubuntu"
  become: true
  copy:
    src: "bashrc"
    dest: "/root/.bashrc"
    mode: 0644

- name: "setup .bashrc"
  when: ansible_distribution == "Debian" or ansible_distribution == "Ubuntu"
  copy:
    src: "bashrc"
    dest: "~/.bashrc"
    mode: 0644
